[package]
name = "toole"
version = "0.1.0"
edition = "2021"
description = "Interactive regular expression testing TUI"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
regex = "1.11"
unicode-width = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
