[package]
name = "toold"
version = "0.1.0"
edition = "2021"
description = "A local-first personal finance ledger TUI"
license = "MIT"

[[bin]]
name = "toold"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = "0.28"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
