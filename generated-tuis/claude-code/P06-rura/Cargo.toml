[package]
name = "toolf"
version = "0.1.0"
edition = "2024"
description = "Interactive Shell pipeline debugging TUI for log analysis"
license = "MIT"
readme = "README.md"

[[bin]]
name = "toolf"
path = "src/main.rs"

[dependencies]
# ratatui pulls in the crossterm backend (and re-exports crossterm itself), so crossterm
# does not need to be a direct dependency.
ratatui = "0.30.2"
clap = { version = "4.6.6", features = ["derive"] }
unicode-width = "0.2.2"

[profile.release]
opt-level = 2
strip = true
