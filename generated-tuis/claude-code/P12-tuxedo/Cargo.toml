[package]
name = "tooll"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "tooll - an interactive todo.txt task manager for the terminal"
license = "MIT"
readme = "README.md"
default-run = "tooll"

[[bin]]
name = "tooll"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = 2
