[package]
name = "toolb"
version = "0.1.0"
edition = "2021"
description = "Kanban board management TUI"
license = "MIT"

[[bin]]
name = "toolb"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
